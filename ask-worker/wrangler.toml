name = "meda-ask"
compatibility_date = "2026-10-12"

# Route and delivery config only. The ask Worker script is not in this repo.
# Do not `wrangler deploy` from here — there is no main script, and a deploy
# would not be a safe stand-in for the live meda-ask Worker.

# Uncomment after DNS for api.meda-vermittlung.de is on Cloudflare.
# The live script must accept both the workers.dev paths (/chat, /intake)
# and the prefixed paths (/ask/chat, /ask/intake).
# [[routes]]
# pattern = "api.meda-vermittlung.de/ask/*"
# zone_name = "meda-vermittlung.de"

# Delivery inbox is a secret. The client no longer sends deliver_to.
#   npx wrangler secret put DELIVER_TO
# The live script is not in this repo. Before the next deploy it must:
# ignore ops.deliver_to and stamp recipients from env.DELIVER_TO,
# compare any token with a constant-time check, rate-limit per IP,
# reject *-DEMO-* tokens when REJECT_DEMO_TOKENS is true,
# call ask-worker/src/guards.mjs guardAsk (rate limit, 16 KB JSON cap,
# Turnstile when REQUIRE_TURNSTILE=true, strip deliver_to), and log no PII.
# Do not embed secrets in that script. Do not set main to guards.mjs.

[vars]
ALLOWED_ORIGINS = "https://meda-vermittlung.de,https://www.meda-vermittlung.de"
REJECT_DEMO_TOKENS = "true"
# The live script must read this flag. Secret: npx wrangler secret put TURNSTILE_SECRET
REQUIRE_TURNSTILE = "false"

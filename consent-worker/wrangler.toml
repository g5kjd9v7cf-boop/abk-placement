name = "meda-consent"
main = "src/index.js"
compatibility_date = "2026-09-20"

[[d1_databases]]
binding = "DB"
database_name = "meda-consent"
database_id = "1f4490cf-dc82-49c6-aa99-c979b7608d79"

# Custom route. Leave commented until DNS for api.meda-vermittlung.de is on
# Cloudflare. Until then the site uses the workers.dev fallback
# (site/js/meda-config.js, API_ORIGIN empty).
# The Worker matches /view, /consent/view, and the other suffixes either way.
# [[routes]]
# pattern = "api.meda-vermittlung.de/consent/*"
# zone_name = "meda-vermittlung.de"

[vars]
ALLOWED_ORIGINS = "https://g5kjd9v7cf-boop.github.io,http://meda-vermittlung.de,https://meda-vermittlung.de,http://www.meda-vermittlung.de,https://www.meda-vermittlung.de"

# STATS_TOKEN is a secret, not a var. The Worker reads env.STATS_TOKEN.
# Set it before the next deploy (removing it from [vars] drops the old binding):
#   npx wrangler secret put STATS_TOKEN
# Rotate: generate a new value locally, run the command above, confirm the
# previous value gets 401 from GET /stats, then discard it. Never commit it.

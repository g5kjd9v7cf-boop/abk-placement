<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Pool Connection — Jarvis</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>AI Pool<br />Connection</h1>
      <p class="tag">Jarvis · multi-model router</p>
      <div class="mode">
        <label><input type="radio" name="mode" value="chat" checked /> Chat (cheapest model)</label>
        <label><input type="radio" name="mode" value="council" /> Council (agents collaborate)</label>
      </div>
      <div class="budget" id="budget">budget: —</div>
      <h2>Providers</h2>
      <ul id="providers" class="providers"><li>loading…</li></ul>
      <button id="reset" class="reset">Reset conversation</button>
      <p class="note">Uses your own API keys. Prefers free/open models (Hermes, Llama, Mistral) before paid ones.</p>
    </aside>
    <main class="chat">
      <div id="messages" class="messages"></div>
      <form id="form" class="composer">
        <input id="input" autocomplete="off" placeholder="Ask Jarvis anything…" />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
